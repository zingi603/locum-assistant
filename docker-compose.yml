services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: locum
      POSTGRES_PASSWORD: locum
      POSTGRES_DB: locum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locum"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
